name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # test/rcon.mjs, test/tools.mjs, test/transport.mjs run the RCON
    # client against a REAL Minecraft server, not a mock (the whole
    # point — this repo's own README explains a real protocol bug that
    # was only caught this way). CI downloads and boots an actual Paper
    # server with RCON enabled, same as local development, rather than
    # skipping that coverage in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: npm ci
        run: npm ci

      # Paper 1.21.11 (Minecraft 1.21.11) runs on Java 21 - newer Paper
      # lines (26.x) require Java 25+, which setup-java doesn't offer a
      # stable distribution for yet.
      - name: Download Paper server
        run: |
          mkdir -p mc-server
          curl -sL -o mc-server/server.jar \
            "https://fill-data.papermc.io/v1/objects/5ffef465eeeb5f2a3c23a24419d97c51afd7dbb4923ff42df9a3f58bba1ccfba/paper-1.21.11-132.jar"

      - name: Configure and start Paper server
        run: |
          cd mc-server
          echo "eula=true" > eula.txt
          RCON_PASS=$(openssl rand -hex 16)
          cat > server.properties << EOF
          enable-rcon=true
          rcon.port=25575
          rcon.password=${RCON_PASS}
          server-port=25565
          online-mode=false
          enable-query=false
          white-list=false
          spawn-protection=0
          level-type=flat
          generate-structures=false
          view-distance=4
          simulation-distance=4
          max-players=5
          EOF
          echo "MC_RCON_PASSWORD=${RCON_PASS}" >> "$GITHUB_ENV"
          nohup java -Xmx1024M -Xms512M -jar server.jar --nogui > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for RCON to come up
        run: |
          for i in $(seq 1 60); do
            if grep -q "RCON running on" mc-server/server.log 2>/dev/null; then
              echo "RCON is up."
              exit 0
            fi
            sleep 2
          done
          echo "Server never reported RCON as ready - log follows:"
          cat mc-server/server.log
          exit 1

      - name: npm test
        env:
          MC_RCON_HOST: 127.0.0.1
          MC_RCON_PORT: 25575
        run: npm test

      - name: Server log (always, for debugging)
        if: always()
        run: cat mc-server/server.log || true

      - name: Stop server
        if: always()
        run: kill "$(cat mc-server/server.pid)" 2>/dev/null || true
